services:
  authentification_frontend:
    volumes:
      - ./authentification-frontend/webserver/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./authentification-frontend/webserver/auth_frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./authentification-frontend/admin/:/usr/share/nginx/html/admin/:ro
      - ./authentification-frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./authentification-frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./authentification-frontend/auth.css:/usr/share/nginx/html/auth.css:ro
      - ./authentification-frontend/app.js:/usr/share/nginx/html/app.js:ro
