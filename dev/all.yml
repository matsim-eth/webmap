# NOTE: aggregates every dev/<service>.yml overlay (verbatim copies) — when you
# change a service here, apply the same change in its dev/<service>.yml.

services:
  # ── nginx-Proxy deaktivieren ───────────────────────────────────
  proxy:
    profiles:
      - nginx

  # ── Vite Dev Proxy (ersetzt nginx) ────────────────────────────
  dev_proxy:
    build: ./dev-proxy
    volumes:
      - ./dev-proxy/vite.config.js:/app/vite.config.js:ro
    ports:
      - "${PROXY_PORT:-80}:3000"
    depends_on:
      webmap_frontend:
        condition: service_started
      dashboard_frontend:
        condition: service_started
      webmap_backend:
        condition: service_started
      dataset_backend:
        condition: service_started
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_started
    networks:
      - internal

  # ── Auth Backend: dev target + hot reload ──────────────────────
  authentification_backend:
    image: authentification-backend:dev
    build:
      context: ./authentification-backend
      target: dev
    volumes:
      - ./authentification-backend:/app
    environment:
      UVICORN_WORKERS: "1"
      ENV: dev

  # ── Auth Frontend: bind mounts for live editing ────────────────
  authentification_frontend:
    build:
      context: ./authentification-frontend
    volumes:
      - ./authentification-frontend/webserver/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./authentification-frontend/webserver/auth_frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./authentification-frontend/admin/:/usr/share/nginx/html/admin/:ro
      - ./authentification-frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./authentification-frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./authentification-frontend/auth.css:/usr/share/nginx/html/auth.css:ro
      - ./authentification-frontend/app.js:/usr/share/nginx/html/app.js:ro

  # ── Dataset Backend: dev target + hot reload ───────────────────
  dataset_backend:
    image: dataset-backend:dev
    build:
      context: ./dataset-backend
      target: dev
    volumes:
      - ./dataset-backend:/app
      - dataset_storage:/data/datasets
    environment:
      UVICORN_WORKERS: "1"

  # ── Webmap Backend: dev target + hot reload ────────────────────
  webmap_backend:
    image: webmap-backend:dev
    build:
      context: ./webmap-backend
      target: dev
    volumes:
      - ./webmap-backend:/app
      - dataset_storage:/data/datasets:ro
    environment:
      ENV: dev

  # ── Webmap Frontend: Vite dev server + HMR ─────────────────────
  webmap_frontend:
    image: webmap-frontend:dev
    build:
      context: ./webmap-frontend
      target: dev
    volumes:
      - ./webmap-frontend:/app
      - webmap_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      VITE_MAPBOX_TOKEN: "${VITE_MAPBOX_TOKEN}"

  # ── Dashboard Frontend: Vite dev server + HMR ──────────────────
  dashboard_frontend:
    image: dashboard-frontend:dev
    build:
      context: ./dashboard-frontend
      target: dev
    volumes:
      - ./dashboard-frontend:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      VITE_MAPBOX_TOKEN: "${VITE_MAPBOX_TOKEN}"

  # ── Ops Backend: dev target + hot reload ───────────────────────
  ops_backend:
    image: ops-backend:dev
    build:
      context: ./ops-backend
      target: dev
    volumes:
      - ./ops-backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/project/.env
    environment:
      ENV: dev

volumes:
  webmap_node_modules:
  dashboard_node_modules: