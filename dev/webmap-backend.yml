# NOTE: dev/all.yml contains a copy of this service block — keep both in sync.
services:
  webmap_backend:
    image: webmap-backend:dev
    build:
      context: ./webmap-backend
      target: dev
    volumes:
      - ./webmap-backend:/app
      - dataset_storage:/data/datasets:ro
    environment:
      ENV: dev

  mcp_backend:
    image: webmap-backend:dev
    build:
      context: ./webmap-backend
      target: dev
    command: ["python", "mcp/server.py", "--http", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - ./webmap-backend:/app
      - dataset_storage:/data/datasets:ro
    environment:
      ENV: dev