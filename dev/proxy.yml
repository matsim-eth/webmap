# NOTE: dev/all.yml contains a copy of the dev_proxy block — keep both in sync.
# Ersetzt den nginx-Proxy durch den Vite Dev Proxy.
# Frontends bleiben GHCR images (nginx) — es sei denn man fügt
# dev/webmap-frontend.yml oder dev/dashboard-frontend.yml hinzu.
#
#   docker compose -f docker-compose.yml -f dev/proxy.yml up
#   docker compose -f docker-compose.yml -f dev/proxy.yml -f dev/webmap-backend.yml up

services:
  # nginx-Proxy deaktivieren (startet nur mit --profile nginx)
  proxy:
    profiles:
      - nginx

  # ── Vite Dev Proxy (ersetzt nginx) ────────────────────────────
  dev_proxy:
    build: ./dev-proxy
    volumes:
      - ./dev-proxy/vite.config.js:/app/vite.config.js:ro
    ports:
      - "${PROXY_PORT:-80}:3000"
    depends_on:
      webmap_frontend:
        condition: service_started
      dashboard_frontend:
        condition: service_started
      webmap_backend:
        condition: service_started
      dataset_backend:
        condition: service_started
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_started
    networks:
      - internal