# NOTE: dev/all.yml contains a copy of this service block — keep both in sync.
services:
  webmap_frontend:
    image: webmap-frontend:dev
    build:
      context: ./webmap-frontend
      target: dev
    volumes:
      - ./webmap-frontend:/app
      - webmap_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      VITE_MAPBOX_TOKEN: "${VITE_MAPBOX_TOKEN}"

volumes:
  webmap_node_modules: