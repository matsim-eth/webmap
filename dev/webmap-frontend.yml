services:
  webmap_frontend:
    build:
      context: ./webmap-frontend
      target: dev
    volumes:
      - ./webmap-frontend:/app
      - webmap_node_modules:/app/node_modules
    expose:
      - "5121"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

  dev_proxy:
    environment:
      WEBMAP_FRONTEND_PORT: "5121"
      WEBMAP_DEV: "1"

volumes:
  webmap_node_modules:
