# ── Full Local Dev ────────────────────────────────────────────────
# Alle Services lokal bauen + hot reload + Vite Dev Proxy.
# Wird automatisch gemerged bei:
#   docker compose up
#
# Einzelnen Service entwickeln (Rest = GHCR images):
#   docker compose -f docker-compose.yml -f dev/proxy.yml -f dev/<service>.yml up
#
# Alles aus GHCR (prod):
#   docker compose -f docker-compose.yml up
# ──────────────────────────────────────────────────────────────────

services:
  # ── nginx-Proxy deaktivieren ───────────────────────────────────
  proxy:
    profiles:
      - nginx

  # ── Vite Dev Proxy (ersetzt nginx) ────────────────────────────
  dev_proxy:
    build: ./dev-proxy
    volumes:
      - ./dev-proxy/vite.config.js:/app/vite.config.js:ro
    ports:
      - "80:3000"
    environment:
      WEBMAP_FRONTEND_PORT: "5121"
      WEBMAP_DEV: "1"
      DASHBOARD_FRONTEND_PORT: "5122"
      DASHBOARD_DEV: "1"
    depends_on:
      webmap_frontend:
        condition: service_started
      dashboard_frontend:
        condition: service_started
      webmap_backend:
        condition: service_started
      dataset_backend:
        condition: service_started
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_started
    networks:
      - internal

  # ── Auth Backend: dev target + hot reload ──────────────────────
  authentification_backend:
    build:
      context: ./authentification-backend
      target: dev
    volumes:
      - ./authentification-backend:/app
    environment:
      UVICORN_WORKERS: "1"
      ENV: dev

  # ── Auth Frontend: bind mounts for live editing ────────────────
  authentification_frontend:
    volumes:
      - ./authentification-frontend/webserver/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./authentification-frontend/webserver/auth_frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./authentification-frontend/admin/:/usr/share/nginx/html/admin/:ro
      - ./authentification-frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./authentification-frontend/styles.css:/usr/share/nginx/html/styles.css:ro

  # ── Dataset Backend: dev target + hot reload ───────────────────
  dataset_backend:
    build:
      context: ./dataset-backend
      target: dev
    volumes:
      - ./dataset-backend:/app
      - dataset_storage:/data/datasets
    environment:
      UVICORN_WORKERS: "1"

  # ── Webmap Backend: dev target + hot reload ────────────────────
  webmap_backend:
    build:
      context: ./webmap-backend
      target: dev
    volumes:
      - ./webmap-backend:/app
      - dataset_storage:/data/datasets:ro
    environment:
      ENV: dev

  # ── Webmap Frontend: Vite dev server + HMR ─────────────────────
  webmap_frontend:
    build:
      context: ./webmap-frontend
      target: dev
    volumes:
      - ./webmap-frontend:/app
      - webmap_node_modules:/app/node_modules
    expose:
      - "5121"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

  # ── Dashboard Frontend: Vite dev server + HMR ──────────────────
  dashboard_frontend:
    build:
      context: ./dashboard-frontend
      target: dev
    volumes:
      - ./dashboard-frontend:/app
      - dashboard_node_modules:/app/node_modules
    expose:
      - "5122"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

volumes:
  webmap_node_modules:
  dashboard_node_modules:
