server {
  listen 5021;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite builds with base '/webmap/' and the reverse proxy forwards the
  # full path, so the bundle lives under html/webmap/.
  location /webmap/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /webmap/ {
    try_files $uri $uri/ /webmap/index.html;
  }

  location = / { return 302 /webmap/; }
}
