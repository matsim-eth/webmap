<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTSM Validation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./auth.css" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.3/mapbox-gl.css" rel="stylesheet" />
</head>
<body>
  <!-- Swiss canton map background (non-interactive Mapbox) — rendered first, behind everything -->
  <div id="bg-map" class="auth-bg-map"></div>

  <div class="auth-layout">
    <main class="main-content">

      <!-- Auth forms -->
      <div class="auth-center">

        <!-- Auth view (login / register) -->
        <div id="authView" class="auth-container">
          <div class="auth-card-wrapper">

            <!-- Vertical app tabs on the left edge -->
            <nav class="app-tabs" id="destinationNav">
              <button class="app-tab active" data-dest="/webmap/" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
                  <line x1="8" y1="2" x2="8" y2="18"/>
                  <line x1="16" y1="6" x2="16" y2="22"/>
                </svg>
                <span>Webmap</span>
              </button>
              <button class="app-tab" data-dest="/dashboard/" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"/>
                  <line x1="12" y1="20" x2="12" y2="4"/>
                  <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>Dashboard</span>
              </button>
            </nav>

            <!-- Auth card -->
            <div class="auth-card">
              <div class="auth-header">
                <h2 class="auth-title">Welcome</h2>
                <p class="auth-subtitle">Sign in to continue to <span id="destLabel">Webmap</span></p>
              </div>

              <div class="auth-tabs" id="authTabs">
                <button class="auth-tab active" data-tab="login" type="button">Login</button>
                <button class="auth-tab" data-tab="register" type="button">Register</button>
              </div>

              <!-- Login form -->
              <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                  <label class="form-label" for="identifier">Email or username</label>
                  <input class="form-input" id="identifier" name="identifier" autocomplete="username" required />
                  <span class="form-error">Please enter your email or username.</span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="password">Password</label>
                  <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required />
                  <span class="form-error">Please enter your password.</span>
                </div>
                <button class="btn btn-primary" id="loginSubmit" type="submit">
                  <span class="btn-spinner hidden" id="loginSpinner"></span>
                  Sign in
                </button>
              </form>

              <!-- Register form -->
              <form id="registerForm" class="auth-form hidden" novalidate>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="first_name">First name</label>
                    <input class="form-input" id="first_name" name="first_name" autocomplete="given-name" required />
                    <span class="form-error">Required.</span>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="last_name">Last name</label>
                    <input class="form-input" id="last_name" name="last_name" autocomplete="family-name" required />
                    <span class="form-error">Required.</span>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="username">Username <span class="form-optional">(optional)</span></label>
                  <input class="form-input" id="username" name="username" autocomplete="username" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="company">Company <span class="form-optional">(optional)</span></label>
                  <input class="form-input" id="company" name="company" autocomplete="organization" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="email">Email</label>
                  <input class="form-input" id="email" name="email" type="email" autocomplete="email" required />
                  <span class="form-error">Please enter a valid email.</span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="regPassword">Password</label>
                  <input class="form-input" id="regPassword" name="password" type="password" autocomplete="new-password" required minlength="8" />
                  <span class="form-error">Minimum 8 characters.</span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="regPassword2">Repeat password</label>
                  <input class="form-input" id="regPassword2" name="password2" type="password" autocomplete="new-password" required minlength="8" />
                  <span class="form-error">Passwords must match.</span>
                </div>
                <label class="form-checkbox">
                  <input type="checkbox" value="1" id="newsletter" name="newsletter" />
                  <span>Subscribe to newsletter</span>
                </label>
                <button class="btn btn-primary" id="registerSubmit" type="submit">
                  <span class="btn-spinner hidden" id="registerSpinner"></span>
                  Create account
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Logged-in view -->
        <div id="loggedInView" class="auth-container hidden">
          <div class="auth-card-wrapper">
            <nav class="app-tabs" id="destinationNavLoggedIn">
              <button class="app-tab active" data-dest="/webmap/" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
                  <line x1="8" y1="2" x2="8" y2="18"/>
                  <line x1="16" y1="6" x2="16" y2="22"/>
                </svg>
                <span>Webmap</span>
              </button>
              <button class="app-tab" data-dest="/dashboard/" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"/>
                  <line x1="12" y1="20" x2="12" y2="4"/>
                  <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>Dashboard</span>
              </button>
            </nav>
            <div class="auth-card">
              <div class="auth-header">
                <h2 class="auth-title">Welcome back</h2>
                <p class="auth-subtitle">You are already signed in.</p>
              </div>
              <div class="auth-actions">
                <button id="goApp" class="btn btn-primary" type="button">Continue to Webmap</button>
                <button id="logoutBtn" class="btn btn-outline" type="button">
                  <span class="btn-spinner hidden" id="logoutSpinner"></span>
                  Sign out
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast-container" id="toastContainer">
    <div class="toast" id="toast">
      <span id="toastBody">Error</span>
    </div>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.3/mapbox-gl.js"></script>
  <script src="./app.js"></script>
</body>
</html>
