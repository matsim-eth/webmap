services:
  # ── Databases ──────────────────────────────────────────────────
  authentification_database:
    image: postgres:16
    environment:
      POSTGRES_USER: "${AUTH_DB_USER:-user}"
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:-pass}"
      POSTGRES_DB: "${AUTH_DB_NAME:-appdb}"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  dataset_database:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DATASET_DB_USER:-dataset_user}"
      POSTGRES_PASSWORD: "${DATASET_DB_PASSWORD:-dataset_pass}"
      POSTGRES_DB: "${DATASET_DB_NAME:-datasetdb}"
    volumes:
      - dataset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  # ── Auth ────────────────────────────────────────────────────────
  authentification_frontend:
    image: ghcr.io/matsim-eth/webmap/authentification-frontend:latest
    expose:
      - "5022"
    networks:
      - internal

  authentification_backend:
    image: ghcr.io/matsim-eth/webmap/authentification-backend:latest
    environment:
      DB_CREATE_TABLES: "1"
      DATABASE_URL: "postgresql+asyncpg://${AUTH_DB_USER:-user}:${AUTH_DB_PASSWORD:-pass}@authentification_database:5432/${AUTH_DB_NAME:-appdb}"
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      ENV: "${ENV:-prod}"
      DEV_MODE: "${DEV_MODE:-0}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@webmap.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      DEV_EMAIL: "${DEV_EMAIL:-dev@local}"
      DEV_PASSWORD: "${DEV_PASSWORD:-dev}"
      DATASET_SERVICE_URL: http://dataset_backend:5033
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-}"
      ROOT_PATH: /authentification/backend
      # Registration gates (both optional, default off)
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-0}"
      REQUIRE_ADMIN_APPROVAL: "${REQUIRE_ADMIN_APPROVAL:-0}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    depends_on:
      authentification_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5032/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    expose:
      - "5032"
    networks:
      - internal

  # ── Dataset ─────────────────────────────────────────────────────
  dataset_backend:
    image: ghcr.io/matsim-eth/webmap/dataset-backend:latest
    environment:
      DB_CREATE_TABLES: "1"
      DATABASE_URL: "postgresql+asyncpg://${DATASET_DB_USER:-dataset_user}:${DATASET_DB_PASSWORD:-dataset_pass}@dataset_database:5432/${DATASET_DB_NAME:-datasetdb}"
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      DATASET_STORAGE_ROOT: /data/datasets
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-}"
      ROOT_PATH: /backend/datasets
    volumes:
      - dataset_storage:/data/datasets
    depends_on:
      dataset_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5033/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    expose:
      - "5033"
    networks:
      - internal

  # ── Webmap Backend ──────────────────────────────────────────────
  webmap_backend:
    image: ghcr.io/matsim-eth/webmap/webmap-backend:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      DATASET_SERVICE_URL: http://dataset_backend:5033
      # Lets the startup prewarm ask dataset_backend which dataset is the admin's
      # default, so that one is warmed first (it has no user cookie at startup).
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-}"
      DATASET_STORAGE_ROOT: /data/datasets
      WEBMAP_ROOT: "${WEBMAP_ROOT:-/data/datasets/public}"
      ROOT_PATH: /backend
      LOCAL_RUN: "${LOCAL_RUN:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # Resource tuning (empty = DuckDB defaults; set in .env on laptops)
      DUCKDB_MEMORY_LIMIT: "${DUCKDB_MEMORY_LIMIT:-}"
      DUCKDB_THREADS: "${DUCKDB_THREADS:-}"
      # Cache warming (providers/warmup.py). Defaults warm every dataset,
      # default-first; the tuning knobs only reach the container if listed here.
      WEBMAP_PREWARM: "${WEBMAP_PREWARM:-1}"
      WEBMAP_PREWARM_LIMIT: "${WEBMAP_PREWARM_LIMIT:-0}"
      WEBMAP_PREWARM_QUIET: "${WEBMAP_PREWARM_QUIET:-3}"
      WEBMAP_PREWARM_MAX_WAIT: "${WEBMAP_PREWARM_MAX_WAIT:-300}"
      WEBMAP_PREWARM_YIELD: "${WEBMAP_PREWARM_YIELD:-1}"
      WEBMAP_WARM_ON_SWITCH: "${WEBMAP_WARM_ON_SWITCH:-1}"
      WEBMAP_WARM_QUIET: "${WEBMAP_WARM_QUIET:-1}"
    volumes:
      - dataset_storage:/data/datasets:ro
      # AI-agent failure log (JSONL) — reviewed in batches to fix prompt/
      # tool bugs; host path data/ai-logs/
      - ai_logs:/app/ai_logs
    depends_on:
      dataset_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5031/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    expose:
      - "5031"
    networks:
      - internal

  # ── MCP Backend (AI tool access for MCP clients) ────────────────
  # Same image as webmap_backend, different entrypoint: streamable-HTTP
  # MCP server with bearer-token auth (personal API tokens created in the
  # webmap UI). Dataset access rights are enforced via dataset_backend.
  mcp_backend:
    image: ghcr.io/matsim-eth/webmap/webmap-backend:latest
    command: ["python", "mcp/server.py", "--http", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      AUTH_SERVICE_URL: http://authentification_backend:5032
      DATASET_SERVICE_URL: http://dataset_backend:5033
      SIM_SERVICE_URL: http://sim_backend:5035
      DUCKDB_MEMORY_LIMIT: "${DUCKDB_MEMORY_LIMIT:-}"
      DUCKDB_THREADS: "${DUCKDB_THREADS:-}"
    volumes:
      - dataset_storage:/data/datasets:ro
    depends_on:
      dataset_backend:
        condition: service_healthy
      authentification_backend:
        condition: service_healthy
    healthcheck:
      # Any HTTP response (incl. 406 for a plain GET) means the server is up
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error\ntry: urllib.request.urlopen('http://localhost:8090/mcp', timeout=3)\nexcept urllib.error.HTTPError: pass"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    expose:
      - "8090"
    networks:
      - internal

  # ── Sim Backend (custom-run broker) ─────────────────────────────
  # Validates scenario diffs, holds the job queue, and hands work to the
  # pull-based sim workers (deploy/sim-worker.compose.yml). Jobs live in the
  # dataset Postgres instance (own sim_* tables).
  sim_backend:
    image: ghcr.io/matsim-eth/webmap/sim-backend:latest
    build:
      context: ./sim-backend
      target: prod
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DATASET_DB_USER:-dataset_user}:${DATASET_DB_PASSWORD:-dataset_pass}@dataset_database:5432/${DATASET_DB_NAME:-datasetdb}"
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      DATASET_SERVICE_URL: http://dataset_backend:5033
      SIM_WORKER_TOKEN: "${SIM_WORKER_TOKEN:-}"
      SIM_MAX_ACTIVE_PER_USER: "${SIM_MAX_ACTIVE_PER_USER:-2}"
      ENV: "${ENV:-prod}"
      ROOT_PATH: /backend/sim
    depends_on:
      dataset_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5035/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    expose:
      - "5035"
    networks:
      - internal

  # ── Ops Backend (admin control plane) ───────────────────────────
  ops_backend:
    build:
      context: ./ops-backend
      target: prod
    image: webmap-ops-backend:local
    environment:
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME:-webmap}"
      ENV: "${ENV:-prod}"
      ROOT_PATH: /backend/ops
    volumes:
      # Docker control (restart/logs/stats) — root-equivalent; the service is
      # admin-JWT-gated and only reachable through the proxy.
      - /var/run/docker.sock:/var/run/docker.sock
      # The stack's root .env, editable from the admin panel
      - ./.env:/project/.env
    restart: unless-stopped
    expose:
      - "5034"
    networks:
      - internal

  # ── Webmap Frontend ─────────────────────────────────────────────
  webmap_frontend:
    image: ghcr.io/matsim-eth/webmap/webmap-frontend:latest
    expose:
      - "5021"
    networks:
      - internal

  # ── Dashboard Frontend ──────────────────────────────────────────
  dashboard_frontend:
    image: ghcr.io/matsim-eth/webmap/dashboard-frontend:latest
    expose:
      - "5023"
    networks:
      - internal

  # ── Proxy ───────────────────────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      webmap_frontend:
        condition: service_started
      dashboard_frontend:
        condition: service_started
      webmap_backend:
        condition: service_healthy
      dataset_backend:
        condition: service_healthy
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_healthy
      # service_started (not healthy): a broken MCP must not block the stack
      mcp_backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

volumes:
  ai_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/ai-logs
  auth_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/auth-database
  dataset_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/dataset-database
  dataset_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/dataset-storage

networks:
  internal:
    driver: bridge


# ======================= PORT-SCHEMA / ARCHITEKTUR =======================
# Port-Code: 5 M S T
#   M = Mode    (0 = deploy, 1 = dev)
#   S = Service (1 = proxy, 2 = frontend, 3 = backend, 4 = db)
#   T = Type    (1 = webmap, 2 = auth, 3 = dataset)
#
# Services:
#   authentification_database  -> intern :5432  (T=2, S=4)
#   authentification_backend   -> :5032         (T=2, S=3)
#   authentification_frontend  -> :5022         (T=2, S=2)
#   dataset_database           -> intern :5432  (T=3, S=4)
#   dataset_backend            -> :5033         (T=3, S=3)
#   webmap_backend             -> :5031         (T=1, S=3)
#   webmap_frontend            -> :5021 (prod) / :5121 (dev)
#   dashboard_frontend         -> :5023 (prod) / :5122 (dev)
#   proxy                      -> :80
#
# USAGE:
#   Alles aus GHCR (prod):
#     docker compose -f docker-compose.yml up
#   Alles lokal entwickeln:
#     docker compose -f docker-compose.yml -f dev/all.yml up --build
#   An einem Service arbeiten (Rest = GHCR images):
#     docker compose -f docker-compose.yml -f dev/proxy.yml -f dev/webmap-backend.yml up
#   Mehrere Services gleichzeitig:
#     docker compose -f docker-compose.yml -f dev/proxy.yml -f dev/webmap-frontend.yml -f dev/webmap-backend.yml up
#
# WICHTIG:
# - Proxy ist der einzige Service mit Host-Port.
# - In nginx-upstreams IMMER Service-Namen + Container-Port verwenden.
# - /backend/..., /backend/datasets/..., /authentification/backend/...
#   werden im Proxy per Rewrite auf /... gestripped.
# - ALLE konfigurierbaren Variablen stehen in der root .env Datei.
# ========================================================================
