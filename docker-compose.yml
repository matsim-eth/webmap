services:
  # ── Databases ──────────────────────────────────────────────────
  authentification_database:
    image: postgres:16
    environment:
      POSTGRES_USER: "${AUTH_DB_USER:-user}"
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:-pass}"
      POSTGRES_DB: "${AUTH_DB_NAME:-appdb}"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  dataset_database:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DATASET_DB_USER:-dataset_user}"
      POSTGRES_PASSWORD: "${DATASET_DB_PASSWORD:-dataset_pass}"
      POSTGRES_DB: "${DATASET_DB_NAME:-datasetdb}"
    volumes:
      - dataset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  # ── Auth ────────────────────────────────────────────────────────
  authentification_frontend:
    image: ghcr.io/matsim-eth/webmap/authentification-frontend:latest
    expose:
      - "5022"
    networks:
      - internal

  authentification_backend:
    image: ghcr.io/matsim-eth/webmap/authentification-backend:latest
    environment:
      DB_CREATE_TABLES: "1"
      DATABASE_URL: "postgresql+asyncpg://${AUTH_DB_USER:-user}:${AUTH_DB_PASSWORD:-pass}@authentification_database:5432/${AUTH_DB_NAME:-appdb}"
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      ENV: "${ENV:-prod}"
      DEV_MODE: "${DEV_MODE:-0}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@webmap.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      DEV_EMAIL: "${DEV_EMAIL:-dev@local}"
      DEV_PASSWORD: "${DEV_PASSWORD:-dev}"
      DATASET_SERVICE_URL: http://dataset_backend:5033
      ROOT_PATH: /authentification/backend
    depends_on:
      authentification_database:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "5032"
    networks:
      - internal

  # ── Dataset ─────────────────────────────────────────────────────
  dataset_backend:
    image: ghcr.io/matsim-eth/webmap/dataset-backend:latest
    environment:
      DB_CREATE_TABLES: "1"
      DATABASE_URL: "postgresql+asyncpg://${DATASET_DB_USER:-dataset_user}:${DATASET_DB_PASSWORD:-dataset_pass}@dataset_database:5432/${DATASET_DB_NAME:-datasetdb}"
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      DATASET_STORAGE_ROOT: /data/datasets
      ROOT_PATH: /backend/datasets
    volumes:
      - dataset_storage:/data/datasets
    depends_on:
      dataset_database:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "5033"
    networks:
      - internal

  # ── Webmap Backend ──────────────────────────────────────────────
  webmap_backend:
    image: ghcr.io/matsim-eth/webmap/webmap-backend:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-UltraSecretKey}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      DATASET_SERVICE_URL: http://dataset_backend:5033
      DATASET_STORAGE_ROOT: /data/datasets
      WEBMAP_ROOT: "${WEBMAP_ROOT:-/data/datasets/public}"
      ROOT_PATH: /backend
      LOCAL_RUN: "${LOCAL_RUN:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    volumes:
      - dataset_storage:/data/datasets:ro
    depends_on:
      dataset_backend:
        condition: service_started
    restart: unless-stopped
    expose:
      - "5031"
    networks:
      - internal

  # ── Webmap Frontend ─────────────────────────────────────────────
  webmap_frontend:
    image: ghcr.io/matsim-eth/webmap/webmap-frontend:latest
    expose:
      - "5021"
    networks:
      - internal

  # ── Dashboard Frontend ──────────────────────────────────────────
  dashboard_frontend:
    image: ghcr.io/matsim-eth/webmap/dashboard-frontend:latest
    expose:
      - "5023"
    networks:
      - internal

  # ── Proxy ───────────────────────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      webmap_frontend:
        condition: service_started
      dashboard_frontend:
        condition: service_started
      webmap_backend:
        condition: service_started
      dataset_backend:
        condition: service_started
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

volumes:
  auth_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/auth-database
  dataset_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/dataset-database
  dataset_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/dataset-storage

networks:
  internal:
    driver: bridge


# ======================= PORT-SCHEMA / ARCHITEKTUR =======================
# Port-Code: 5 M S T
#   M = Mode    (0 = deploy, 1 = dev)
#   S = Service (1 = proxy, 2 = frontend, 3 = backend, 4 = db)
#   T = Type    (1 = webmap, 2 = auth, 3 = dataset)
#
# Services:
#   authentification_database  -> intern :5432  (T=2, S=4)
#   authentification_backend   -> :5032         (T=2, S=3)
#   authentification_frontend  -> :5022         (T=2, S=2)
#   dataset_database           -> intern :5432  (T=3, S=4)
#   dataset_backend            -> :5033         (T=3, S=3)
#   webmap_backend             -> :5031         (T=1, S=3)
#   webmap_frontend            -> :5021 (prod) / :5121 (dev)
#   dashboard_frontend         -> :5023 (prod) / :5122 (dev)
#   proxy                      -> :80
#
# USAGE:
#   Alles aus GHCR (prod):
#     docker compose -f docker-compose.yml up
#   Alles lokal entwickeln (auto-merge override):
#     docker compose up
#   An einem Service arbeiten (Rest = GHCR images):
#     docker compose -f docker-compose.yml -f dev/proxy.yml -f dev/webmap-backend.yml up
#   Mehrere Services gleichzeitig:
#     docker compose -f docker-compose.yml -f dev/proxy.yml -f dev/webmap-frontend.yml -f dev/webmap-backend.yml up
#
# WICHTIG:
# - Proxy ist der einzige Service mit Host-Port.
# - In nginx-upstreams IMMER Service-Namen + Container-Port verwenden.
# - /backend/..., /backend/datasets/..., /authentification/backend/...
#   werden im Proxy per Rewrite auf /... gestripped.
# - ALLE konfigurierbaren Variablen stehen in der root .env Datei.
# ========================================================================
