services:
  authentification_database:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal


  authentification_frontend:
    build:
      context: ./auth/frontend
      dockerfile: Dockerfile
    volumes:
      - ./auth/frontend/webserver/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./auth/frontend/webserver/auth_frontend.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "5022"
    profiles: ["deploy", "dev"]
    networks:
      - internal

  authentification_backend:
    build:
      context: ./auth/backend
      dockerfile: Dockerfile
    environment:
      DB_CREATE_TABLES: "1"
      DATABASE_URL: postgresql+asyncpg://user:pass@authentification_database:5432/appdb
    depends_on:
      authentification_database:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "5032"
    profiles: ["deploy", "dev"]
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      LOCAL_RUN: "1"
      WEBMAP_ROOT: "./dummy_data/webmap_data/"
      CORS_ORIGINS: "*"
    expose:
      - "5031"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    profiles: ["deploy", "dev"]
    networks:
      - internal

  webmap_dev:
    build:
      context: ./webmap
      dockerfile: Dockerfile
      target: dev
    expose:
      - "5121"
    volumes:
      - ./webmap:/app
      - webmap_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    profiles: ["dev"]
    networks:
      - internal

  webmap_prod:
    build:
      context: ./webmap
      dockerfile: Dockerfile
      target: prod
    volumes:
      - ./webmap/webconfig/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webmap/webconfig/frontend_prod.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "5021"
    profiles: ["deploy"]
    networks:
      - internal

  dashboard_dev:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: dev
    expose:
      - "5122"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    profiles: ["dev"]
    networks:
      - internal

  dashboard_prod:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: prod
    expose:
      - "5023"
    profiles: ["deploy"]
    networks:
      - internal

  proxy_dev:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      webmap_dev:
        condition: service_started
      dashboard_dev:
        condition: service_started
      backend:
        condition: service_started
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_started
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      - internal

  proxy_deploy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/deploy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      webmap_prod:
        condition: service_started
      dashboard_prod:
        condition: service_started
      backend:
        condition: service_started
      authentification_frontend:
        condition: service_started
      authentification_backend:
        condition: service_started

    restart: unless-stopped
    profiles: ["deploy"]
    networks:
      - internal

volumes:
  auth_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./auth/database
  webmap_node_modules:
  dashboard_node_modules:

networks:
  internal:
    driver: bridge


# ======================= PORT-SCHEMA / ARCHITEKTUR =======================
# Port-Code: 5 M S T
#   M = Mode    (0 = deploy, 1 = dev)
#   S = Service (1 = proxy, 2 = frontend, 3 = backend, 4 = db)
#   T = Type    (1 = webmap, 2 = auth)
#
# Deploy:
#   5011 -> proxy_deploy (HTTP, einziger externer Entry-Point)
#   webmap_prod  -> intern :80 (nur über Proxy erreichbar)
#   backend      -> intern :5031 (nur über Proxy erreichbar)
#
# Dev:
#   5111 -> proxy_dev (HTTP)
#   5121 -> webmap_dev (Vite Dev Server, optional direkter Zugriff)
#   backend -> intern :5031 (über Proxy erreichbar)
#
# WICHTIG:
# - Proxy ist der einzige Service mit Host-Port im Deploy.
# - In nginx-upstreams IMMER Service-Namen + Container-Port verwenden
#   (z.B. backend:5031, webmap_prod:80), NIE Host-Ports.
# ========================================================================
