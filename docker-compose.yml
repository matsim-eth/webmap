services:
  auth_db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  backend:
    build:
      context: ./auth
      dockerfile: Dockerfile
    environment:
      DB_CREATE_TABLES: "1"
      DATABASE_URL: postgresql+asyncpg://user:pass@auth_db:5432/appdb
    depends_on:
      auth_db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8090"
    networks:
      - internal


  webmap_frontend_dev:
    build:
      context: ./webmap/frontend
      dockerfile: Dockerfile
      target: dev
    expose:
      - "5121"
    volumes:
      - ./webmap/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    profiles: ["dev"]
    networks:
      - internal


  webmap_frontend_prod:
    build:
      context: ./webmap/frontend
      dockerfile: Dockerfile
      target: prod
    volumes:
      - ./webmap/frontend/webconfig/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webmap/frontend/webconfig/frontend_prod.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "5021"
    profiles: ["deploy"]
    networks:
      - internal

  proxy_dev:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      #- backend
      - webmap_frontend_dev
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      - internal

  proxy_deploy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/deploy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
     # - backend
      - webmap_frontend_prod
    restart: unless-stopped
    profiles: ["deploy"]
    networks:
      - internal

volumes:
  auth_db_data:
  frontend_node_modules:

networks:
  internal:
    driver: bridge


# ======================= PORT-SCHEMA / ARCHITEKTUR =======================
# Port-Code: 5 M S T
#   M = Mode    (0 = deploy, 1 = dev)
#   S = Service (1 = proxy, 2 = frontend, 3 = backend, 4 = db)
#   T = Type    (1 = webmap, 2 = auth)
#
# Deploy:
#   5011 -> proxy_deploy (HTTP, einziger externer Entry-Point)
#   frontend_prod -> intern :80 (nur über Proxy erreichbar)
#   backend       -> intern :8090 (nur über Proxy erreichbar)
#
# Dev:
#   5111 -> proxy_dev (HTTP)
#   5121 -> webmap_frontend_dev (Vite Dev Server, optional direkter Zugriff)
#   backend -> intern :8090 (über Proxy erreichbar)
#
# WICHTIG:
# - Proxy ist der einzige Service mit Host-Port im Deploy.
# - In nginx-upstreams IMMER Service-Namen + Container-Port verwenden
#   (z.B. backend:8090, webmap_frontend_prod:80), NIE Host-Ports.
# - /webmap/frontend/... und /webmap/backend/... werden im Proxy
#   per Rewrite auf /... gestripped.
# ========================================================================