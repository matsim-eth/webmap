server {
  listen 5023;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite builds with base '/dashboard/' and the reverse proxy forwards the
  # full path, so the bundle lives under html/dashboard/.
  location /dashboard/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /dashboard/ {
    try_files $uri $uri/ /dashboard/index.html;
  }

  location = / { return 302 /dashboard/; }
}
