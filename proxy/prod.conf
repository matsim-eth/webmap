upstream fe { server webmap_frontend:5021; }
upstream db { server dashboard_frontend:5023; }
upstream wbe { server webmap_backend:5031; }
upstream dbe { server dataset_backend:5033; }
upstream abe { server authentification_backend:5032; }
upstream afe { server authentification_frontend:5022; }

server {
  listen 80;

  location = / { return 302 /webmap/; }

  location ^~ /backend/datasets/ {
    rewrite ^/backend/datasets/(.+?)/?$ /$1 break;
    proxy_pass http://dbe;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Dataset uploads are whole duckdb files (5–15 GB): no body-size cap,
    # stream to the backend instead of buffering to disk, and allow slow
    # links to finish.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  location = /backend/datasets { return 302 /backend/datasets/; }

  location ^~ /backend/ {
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass http://wbe;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Cold duckdb scans (e.g. speed_dashboard on a 15 GB file) can exceed
    # the 60 s default and would 504 mid-computation.
    proxy_read_timeout 300s;
  }
  location = /backend { return 302 /backend/; }

  location ^~ /authentification/backend/ {
    rewrite ^/authentification/backend/(.+?)/?$ /$1 break;
    proxy_pass http://abe;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location = /authentification/backend { return 302 /authentification/backend/; }

  location ^~ /authentification/ {
    rewrite ^/authentification/(.*)$ /$1 break;
    proxy_pass http://afe;
    proxy_set_header Host $host;
  }

  location = /authentification/admin { return 302 /authentification/admin/; }
  location = /authentification { return 302 /authentification/; }
  location = /authentification/frontend { return 302 /authentification/; }
  location = /authentification/frontend/ { return 302 /authentification/; }

  location ^~ /dashboard/ {
    proxy_pass http://db;
    proxy_set_header Host $host;
  }

  location = /dashboard { return 302 /dashboard/; }

  location ^~ /webmap/ {
    proxy_pass http://fe;
    proxy_set_header Host $host;
  }

  location = /webmap { return 302 /webmap/; }
}
