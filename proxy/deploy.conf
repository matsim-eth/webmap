upstream fe { server webmap_frontend_prod:5021; }
#upstream be { server backend:8090; }

server {
  listen 80;

  # /webmap/backend/... -> backend (prefix strip)
 ## location ^~ /webmap/backend/ {
   ## rewrite ^/webmap/backend/(.*)$ /$1 break;
 ##   proxy_pass http://be;
  ##  proxy_set_header Host $host;
   ## proxy_set_header X-Real-IP $remote_addr;
  ##  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  ##  proxy_set_header X-Forwarded-Proto $scheme;
 ## }

  # Preferred entry: /webmap/frontend/... -> frontend (prefix strip)
  location ^~ /webmap/frontend/ {
    rewrite ^/webmap/frontend/(.*)$ /$1 break;
    proxy_pass http://fe;
    proxy_set_header Host $host;
  }

  # Compatibility: if something still calls /webmap/assets/...
  location ^~ /webmap/assets/ {
    rewrite ^/webmap/(.*)$ /$1 break;
    proxy_pass http://fe;
    proxy_set_header Host $host;
  }

  # Common static files referenced as /webmap/<file>
  location ~ ^/webmap/(.*\.(svg|png|ico|json|txt|woff2?|css|js))$ {
    rewrite ^/webmap/(.*)$ /$1 break;
    proxy_pass http://fe;
    proxy_set_header Host $host;
  }

  location = /webmap/ { return 302 /webmap/frontend/; }
}