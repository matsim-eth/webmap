upstream fe {
  server webmap_frontend_dev:5121;
}

log_format webmap_main '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time '
                      'ua="$http_user_agent" '
                      'ref="$http_referer" '
                      'up=$upstream_addr us=$upstream_status '
                      'urt=$upstream_response_time';

map $uri $log_webmap_frontend_root {
  default 0;
  /webmap/frontend 1;
  /webmap/frontend/ 1;
}

server {
  listen 80;

  access_log /dev/stdout webmap_main if=$log_webmap_frontend_root;
  error_log  /dev/stderr warn;

  location ^~ /webmap/frontend/ {
    proxy_pass http://fe;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
}
