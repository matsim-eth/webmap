upstream fe {
  server webmap_frontend_dev:5121;
}
upstream abe {
  server authentification_backend:5032;
}
upstream afe { server authentification_frontend:5022; }

log_format webmap_main '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time '
                      'ua="$http_user_agent" '
                      'ref="$http_referer" '
                      'up=$upstream_addr us=$upstream_status '
                      'urt=$upstream_response_time';

map $uri $log_webmap_frontend_root {
  default 0;
  /webmap 1;
  /webmap/ 1;
  /webmap/frontend 1;
  /webmap/frontend/ 1;
}

server {
  listen 80;
  location = / { return 302 /webmap/; }

  location ^~ /authentification/backend/ {
    rewrite ^/authentification/backend/(.*)$ /$1 break;
    proxy_pass http://abe;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location = /authentification/backend { return 302 /authentification/backend/; }

 location ^~ /authentification/ {
    rewrite ^/authentification/(.*)$ /$1 break;
    proxy_pass http://afe;
    proxy_set_header Host $host;
  }

  location = /authentification { return 302 /authentification/; }
  location = /authentification/frontend { return 302 /authentification/; }
  location = /authentification/frontend/ { return 302 /authentification/; }

  location = /login { return 302 /authentification/; }
  location ^~ /login/ { return 302 /authentification/; }


  access_log /dev/stdout webmap_main if=$log_webmap_frontend_root;
  error_log  /dev/stderr warn;

  location = /webmap/frontend/ { return 302 /webmap/; }
  location = /webmap/frontend { return 302 /webmap/; }

  location ^~ /webmap/ {
    proxy_pass http://fe;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
}