<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .system-row { opacity: 0.55; pointer-events: none; }
    .system-row .btn, .system-row input[type=checkbox] { pointer-events: none; }
    .system-badge { font-size: 0.7rem; }
  </style>
</head>
<body class="bg-soft">
  <main class="container py-5">
    <div class="admin-card mx-auto">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h1 class="h4 m-0">Administration</h1>
          <p class="text-muted mb-0">Manage users and datasets.</p>
        </div>
        <div class="d-flex gap-2">
          <a href="/webmap/" class="btn btn-dark btn-sm btn-press">Open App</a>
          <button id="adminLogoutBtn" class="btn btn-outline-dark btn-sm btn-press" type="button">Logout</button>
        </div>
      </div>

      <ul class="nav nav-pills nav-fill mb-3" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="users-tab" data-bs-toggle="pill" data-bs-target="#users-pane" type="button" role="tab">Users</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="datasets-tab" data-bs-toggle="pill" data-bs-target="#datasets-pane" type="button" role="tab">Datasets</button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- ── Users Tab ─────────────────────────────────── -->
        <div class="tab-pane fade show active" id="users-pane" role="tabpanel">
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Email</th><th>Username</th><th>Name</th>
                  <th>Company</th><th>Admin</th><th>Dev</th><th>Active</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- ── Datasets Tab ──────────────────────────────── -->
        <div class="tab-pane fade" id="datasets-pane" role="tabpanel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div id="datasetOwnerFilter" class="d-none">
              <span class="badge bg-dark me-2" id="datasetFilterBadge"></span>
              <button class="btn btn-outline-secondary btn-sm" id="clearDatasetFilter">Show all</button>
            </div>
            <div class="ms-auto">
              <button class="btn btn-dark btn-sm btn-press" id="addDatasetBtn" type="button">+ Add Dataset</button>
            </div>
          </div>

          <!-- Public datasets -->
          <h6 class="mt-2 mb-1">Public Datasets</h6>
          <div class="table-responsive mb-3">
            <table class="table table-sm table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Name</th><th>Description</th><th>Owner</th><th>Status</th>
                  <th>Created</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="publicDatasetsBody"></tbody>
            </table>
          </div>

          <!-- Private datasets -->
          <h6 class="mb-1">Private Datasets</h6>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Name</th><th>Description</th><th>Owner</th><th>Status</th>
                  <th>Created</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="privateDatasetsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Edit User Modal ─────────────────────────────── -->
  <div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editUserId" />
          <div class="mb-2">
            <label class="form-label mb-0">Email</label>
            <input type="email" class="form-control form-control-sm" id="editEmail" />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Username</label>
            <input type="text" class="form-control form-control-sm" id="editUsername" />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">First Name</label>
            <input type="text" class="form-control form-control-sm" id="editFirstName" />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Last Name</label>
            <input type="text" class="form-control form-control-sm" id="editLastName" />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Company</label>
            <input type="text" class="form-control form-control-sm" id="editCompany" />
          </div>
          <hr />
          <div class="mb-2">
            <label class="form-label mb-0">New Password <small class="text-muted">(leave empty to keep current)</small></label>
            <input type="password" class="form-control form-control-sm" id="editPassword" placeholder="min. 8 characters" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark btn-sm" id="saveUserBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Add Dataset Modal ──────────────────────────── -->
  <div class="modal fade" id="addDatasetModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Dataset</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label mb-0">Owner</label>
            <select class="form-select form-select-sm" id="addDsOwner"></select>
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Name</label>
            <input type="text" class="form-control form-control-sm" id="addDsName" required placeholder="My Dataset" />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Description</label>
            <textarea class="form-control form-control-sm" id="addDsDescription" rows="2" placeholder="Optional description"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark btn-sm" id="createDatasetBtn">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Edit Dataset Modal ───────────────────────────── -->
  <div class="modal fade" id="editDatasetModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Dataset</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editDsId" />
          <div class="mb-2">
            <label class="form-label mb-0">ID</label>
            <input type="text" class="form-control form-control-sm" id="editDsIdDisplay" disabled />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Name</label>
            <input type="text" class="form-control form-control-sm" id="editDsName" required />
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Description</label>
            <textarea class="form-control form-control-sm" id="editDsDescription" rows="2"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Status</label>
            <select class="form-select form-select-sm" id="editDsStatus">
              <option value="pending">pending</option>
              <option value="ready">ready</option>
              <option value="error">error</option>
            </select>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="editDsPublic" />
            <label class="form-check-label" for="editDsPublic">Public</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark btn-sm" id="saveDatasetBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Toast ───────────────────────────────────────── -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-body" id="toastBody">Error</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
