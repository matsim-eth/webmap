<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authentication</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="mx-auto auth-card">
      <div class="mb-3">
        <h1 class="h4 mb-0">Authentication</h1>
        <div class="text-body-secondary small">Login / Register</div>
      </div>

      <div class="toast-host" aria-live="polite" aria-atomic="true">
        <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body" id="toastBody">Error</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      </div>

      <ul class="nav nav-pills gap-2 mb-3" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">
            Login
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">
            Register
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <section class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
          <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label">Email oder Username</label>
              <input name="identifier" type="text" class="form-control" autocomplete="username" required />
              <div class="invalid-feedback">Pflichtfeld.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control" autocomplete="current-password" required minlength="8" />
              <div class="invalid-feedback">Mindestens 8 Zeichen.</div>
            </div>

            <div class="d-grid gap-2">
              <button id="loginSubmit" class="btn btn-dark btn-press" type="submit">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner" aria-hidden="true"></span>
                Login
              </button>
            </div>

            <div class="text-center mt-3">
              <button type="button" class="btn btn-link p-0 link-secondary" id="toRegister">
                Noch kein Konto? Registrieren
              </button>
            </div>
          </form>
        </section>

        <section class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
          <form id="registerForm" class="needs-validation" novalidate>
            <div class="row g-2">
              <div class="col-12 col-md-6">
                <label class="form-label">First name</label>
                <input name="first_name" type="text" class="form-control" autocomplete="given-name" required />
                <div class="invalid-feedback">Pflichtfeld.</div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Last name</label>
                <input name="last_name" type="text" class="form-control" autocomplete="family-name" required />
                <div class="invalid-feedback">Pflichtfeld.</div>
              </div>
            </div>

            <div class="mt-2">
              <label class="form-label">Username</label>
              <input name="username" type="text" class="form-control" autocomplete="username" required minlength="3" />
              <div class="invalid-feedback">Mindestens 3 Zeichen.</div>
            </div>

            <div class="mt-2">
              <label class="form-label">Company</label>
              <input name="company" type="text" class="form-control" autocomplete="organization" required />
              <div class="invalid-feedback">Pflichtfeld.</div>
            </div>

            <div class="mt-2">
              <label class="form-label">Email</label>
              <input name="email" type="email" class="form-control" autocomplete="email" required />
              <div class="invalid-feedback">Bitte gültige Email angeben.</div>
            </div>

            <div class="row g-2 mt-2">
              <div class="col-12 col-md-6">
                <label class="form-label">Password</label>
                <input id="regPassword" name="password" type="password" class="form-control" autocomplete="new-password" required minlength="8" />
                <div class="invalid-feedback">Mindestens 8 Zeichen.</div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Repeat password</label>
                <input id="regPassword2" name="password2" type="password" class="form-control" autocomplete="new-password" required minlength="8" />
                <div class="invalid-feedback">Muss mit Password übereinstimmen.</div>
              </div>
            </div>

            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" value="1" id="newsletter" name="newsletter" />
              <label class="form-check-label" for="newsletter">Newsletter abonnieren</label>
            </div>

            <div class="d-grid gap-2 mt-3">
              <button id="registerSubmit" class="btn btn-outline-dark btn-press" type="submit">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="registerSpinner" aria-hidden="true"></span>
                Register
              </button>
            </div>

            <div class="text-center mt-3">
              <button type="button" class="btn btn-link p-0 link-secondary" id="toLogin">
                Schon ein Konto? Login
              </button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
