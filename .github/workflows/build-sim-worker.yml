name: sim-worker

on:
  push:
    branches: [main]
    paths:
      - 'sim-worker/**'
      - 'webmap-backend/scripts/build_transit_volumes/**'
      - '.github/workflows/build-sim-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sim-worker/**'
      - '.github/workflows/build-sim-worker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/matsim-eth/webmap

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Repo-root context: the Dockerfile vendors
      # webmap-backend/scripts/build_transit_volumes into the image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sim-worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sim-worker:latest
            ${{ env.IMAGE_PREFIX }}/sim-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
