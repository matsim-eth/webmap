name: auth-frontend

on:
  push:
    branches: [main]
    paths:
      - 'authentification-frontend/**'
      - '.github/workflows/build-auth-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'authentification-frontend/**'
      - '.github/workflows/build-auth-frontend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/matsim-eth/webmap

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./authentification-frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/authentification-frontend:latest
            ${{ env.IMAGE_PREFIX }}/authentification-frontend:${{ github.sha }}
