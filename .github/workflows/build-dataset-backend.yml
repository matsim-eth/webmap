name: dataset-backend

on:
  push:
    branches: [main]
    paths:
      - 'dataset-backend/**'
      - '.github/workflows/build-dataset-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dataset-backend/**'
      - '.github/workflows/build-dataset-backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/matsim-eth/webmap

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./dataset-backend
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/dataset-backend:latest
            ${{ env.IMAGE_PREFIX }}/dataset-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
