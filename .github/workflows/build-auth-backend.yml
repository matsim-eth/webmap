name: auth-backend

on:
  push:
    branches: [main]
    paths:
      - 'authentification-backend/**'
      - '.github/workflows/build-auth-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'authentification-backend/**'
      - '.github/workflows/build-auth-backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/matsim-eth/webmap

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./authentification-backend
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/authentification-backend:latest
            ${{ env.IMAGE_PREFIX }}/authentification-backend:${{ github.sha }}
